name: "Correction"
description: "A typo, a formatting problem, or a factual error such as an out-of-date reference."
labels: ["correction", "triage"]
body:
  - type: markdown
    attributes:
      value: "Use this form for mistakes that do not change what a rule means. If a rule itself should change, use Policy feedback instead."
  - type: dropdown
    id: section
    attributes:
      label: "Which section is this about?"
      options:
        - "0. Version and certification validity notes"
        - "1. Introduction"
        - "2. Feedback received and updates"
        - "3. Terms and definitions"
        - "4. How organisations participate in the trust framework"
        - "5. Rules for identity service providers"
        - "6. Rules for attribute service providers"
        - "7. Rules for holder service providers"
        - "8. Rules for orchestration service providers"
        - "9. Rules for component service providers"
        - "10. Inclusivity, accessibility and service design"
        - "11. Operational requirements"
        - "12. Service requirements"
        - "13. The register of digital identity and attribute services"
        - "14. The UK CertifID trust mark"
        - "15. Table of standards, guidance and legislation"
        - "16. Glossary of terms and definitions"
        - "Not about a specific section"
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: "Rule or paragraph number (optional)"
      description: "If you know it. Rule numbers start with their section number."
      placeholder: "For example, 12.4.1.c"
  - type: textarea
    id: problem
    attributes:
      label: "What needs correcting?"
      description: "Quote the text if you can and say what is wrong with it."
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: "Suggested correction (optional)"
      description: "If you have one. It is fine to leave this blank."
    validations:
      required: false
  - type: markdown
    attributes:
      value: "Issues are public. Do not include personal data, such as names, email addresses or details about individuals."
