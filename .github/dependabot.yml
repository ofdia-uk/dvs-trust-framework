# Keeps the GitHub Actions and the reading site's dependencies up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: monthly
    groups:
      site-dependencies:
        patterns: ["*"]
