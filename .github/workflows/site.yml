name: Reading site

# Builds the reading site from the Markdown in this repository.
#
# - On every pull request: build the site and check it. Nothing is published.
# - On every change to main: build, check and publish it to GitHub Pages, so
#   the live site always shows the accepted working draft.
#
# Publishing requires GitHub Pages to be enabled with "GitHub Actions" as its
# source (Settings > Pages).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reading-site-${{ github.ref }}
  # Let a publish to main finish; replace superseded pull request builds.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check the site
    runs-on: ubuntu-latest
    env:
      # GitHub Pages serves a project site from /<repository name>/.
      PATH_PREFIX: /${{ github.event.repository.name }}/
      # Feedback links point back to the page at this address.
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The full history and tags, so the site can compare the trust
          # framework with its baseline tag (framework-baseline.json). The
          # build fails if the baseline cannot be found.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: docs-site/.nvmrc
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      # Every rule must have exactly one permanent identity in
      # rule-identities.json. If not, this step says what a maintainer needs
      # to decide (see ARCHITECTURE.md, under Rule identities).
      #
      # It runs only the check, and fails with the command's own status. On
      # failure, the job summary explains how to record the decision in
      # GitHub (the Maintain rule identities workflow) or locally, above the
      # command's output, which says what needs deciding.
      - name: Check rule identities
        working-directory: docs-site
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set +e
          npm run --silent rules > "$RUNNER_TEMP/rule-identities.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/rule-identities.txt"
          if [ "$status" -ne 0 ]; then
            node scripts/rule-identities-summary.js "$RUNNER_TEMP/rule-identities.txt" "$status" >> "$GITHUB_STEP_SUMMARY" \
              || echo "::warning::The job summary could not be written. The output above says what needs deciding."
            if [ "$status" -eq 1 ]; then
              echo "::error title=Rule identity decision required::A rule was added, reworded, renumbered, moved or removed. See this run's Summary page for how to record the decision in GitHub or locally."
            else
              echo "::error title=Rule identity check could not run::See this run's Summary page and the output above."
            fi
          fi
          exit "$status"

      # Only the issues listed in existing-feedback.json are shown on the
      # site. Each must name rules by permanent identities that are still in
      # the working draft, and section files that exist. If not, this step
      # says what to change (see ARCHITECTURE.md, under Existing feedback on
      # the reading site).
      - name: Check existing feedback links
        working-directory: docs-site
        run: npm run --silent feedback

      # Why a change was made is shown on the "What's changed" pages only
      # where it is recorded in change-provenance.json. Each entry must name
      # rules by permanent identity, link issues and pull requests by number,
      # and explain something that has really changed since the baseline.
      # If not, this step says what to change (see ARCHITECTURE.md, under Why
      # a change was made).
      - name: Check why changes were made
        working-directory: docs-site
        run: npm run --silent provenance

      - name: Test the Markdown rendering
        working-directory: docs-site
        run: npm test

      - name: Build the site
        working-directory: docs-site
        run: npm run build

      - name: Check links, anchors, IDs, headings, rule feedback, permanent rule links, existing feedback links, change status, why changes were made and the draft banner
        run: python3 tools/check_site.py docs-site/_site --path-prefix "$PATH_PREFIX"

      - name: Upload the site for publishing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/_site

  publish:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write # to publish the site
      id-token: write # to verify the publish request came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
